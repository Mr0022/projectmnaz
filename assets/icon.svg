<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="کاردرمانی ذهنی کودکان — مهرناز افشار">
  <title>کاردرمانی ذهنی کودکان</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".55" stop-color="#b25cff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <mask id="piece">
      <rect width="512" height="512" fill="#000"/>
      <g transform="translate(256 256) scale(1.44) translate(-233 -230)">
        <g fill="#fff">
          <rect x="152" y="152" width="208" height="208" rx="26"/>
          <circle cx="256" cy="152" r="52"/>
          <circle cx="152" cy="256" r="46"/>
        </g>
        <g fill="#000">
          <circle cx="360" cy="256" r="46"/>
          <circle cx="256" cy="360" r="46"/>
        </g>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" fill="#fff" mask="url(#piece)"/>
</svg>
